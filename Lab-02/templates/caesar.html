<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <p><a href="/">← Quay lại Menu chính</a></p>
        
        <table class="table table-bordered">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px; background-color: #f8f9fa;">MẬT MÃ CAESAR</td></tr>
            <tr><td style="font-weight: bold; color: blue">ENCRYPTION (MÃ HÓA)</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text (Chỉ nhập chữ cái):</label>
                            <input type="text" class="form-control" name="inputPlainText" pattern="[A-Za-z\s]+" title="Văn bản chỉ được chứa ký tự chữ cái (A-Z, a-z)" placeholder="Input Plain Text" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Số nguyên từ 1 - 25):</label>
                            <input type="number" class="form-control" name="inputKeyPlain" min="1" max="25" placeholder="Nhập số từ 1 đến 25" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            <tr><td style="font-weight: bold; color: green">DECRYPTION (GIẢI MÃ)</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text (Chỉ nhập chữ cái):</label>
                            <input type="text" class="form-control" name="inputCipherText" pattern="[A-Za-z\s]+" title="Văn bản mật mã chỉ được chứa ký tự chữ cái (A-Z, a-z)" placeholder="Input Cipher Text" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Số nguyên từ 1 - 25):</label>
                            <input type="number" class="form-control" name="inputKeyCipher" min="1" max="25" placeholder="Nhập số từ 1 đến 25" required/>
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
