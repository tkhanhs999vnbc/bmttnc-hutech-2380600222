<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thực hành An toàn thông tin nâng cao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .student-info { font-size: 14px; margin-bottom: 20px; font-style: italic; }
        .cryptography-section, .steganography-section { margin-top: 30px; text-align: center; }
        .crypto-btn { margin: 10px; width: 200px; padding: 15px; font-weight: bold; }
        .modal-body .student-info { text-align: center; color: #555; }
        .stego-card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; border: none; }
        .section-title { text-transform: uppercase; display: inline-block; padding-bottom: 5px; }
    </style>
</head>
<body style="background-color: #ffffff;">
    <div class="container-fluid text-center py-4 px-5">
        <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="hutech" style="display: block; margin-left: auto; margin-right: auto; width: 300px; max-width: 100%;">
        <h4 style="font-weight: bold; text-align: center; margin-top:20px;">BÀI THỰC HÀNH BẢO MẬT THÔNG TIN NÂNG CAO</h4>
        
        <div style="text-align: center; margin-top: 10px; font-size: 16px; color: #555;">
            <p>Sinh viên thực hiện: <strong>Võ Nguyễn Bảo Châu</strong></p>
            <p>Mã số sinh viên: <strong>2380600222</strong></p>
        </div>

        <!-- MỤC 1: CRYPTOGRAPHY -->
        <div class="cryptography-section">
            <h5 class="font-weight-bold mb-4 section-title" style="color: #007bff; border-bottom: 2px solid #007bff;">Mục 1: Cryptography</h5>
            <div>
                <button class="btn btn-primary crypto-btn" onclick="launchLab03('caesar')">Caesar Cipher</button>
                <button class="btn btn-success crypto-btn" onclick="launchLab03('vigenere')">Vigenere Cipher</button>
            </div>
            <div>
                <button class="btn btn-info crypto-btn" onclick="launchLab03('railfence')">Rail Fence Cipher</button>
                <button class="btn btn-warning crypto-btn" onclick="launchLab03('playfair')">Playfair Cipher</button>
            </div>
        </div>

        <!-- MỤC 2: STEGANOGRAPHY -->
        <div class="steganography-section mt-5 pt-4" style="border-top: 1px solid #eee;">
            <h5 class="font-weight-bold mb-4 section-title" style="color: #28a745; border-bottom: 2px solid #28a745;">Mục 2: Steganography</h5>
            <div class="row text-left mt-3">
                <!-- Encode Section -->
                <div class="col-md-6 mb-3">
                    <div class="card p-4 stego-card h-100" style="border-top: 4px solid #28a745;">
                        <h6 class="font-weight-bold text-success mb-3">🔒 Ẩn Tin (Encode)</h6>
                        <form id="encodeForm">
                            <div class="form-group">
                                <label class="font-weight-bold">1️⃣ Chọn hình ảnh (JPG, PNG):</label>
                                <input type="file" class="form-control-file" id="encodeImage" accept="image/*" required onchange="previewImage(this, 'encodeSelectedPreview')">
                                <div class="mt-2 text-center">
                                    <img id="encodeSelectedPreview" style="max-width: 100%; max-height: 200px; display: none; border-radius: 4px; border: 1px solid #ddd;">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="font-weight-bold">2️⃣ Nội dung cần giấu:</label>
                                <textarea class="form-control" id="encodeText" rows="3" placeholder="Nhập văn bản cần ẩn vào đây..." required></textarea>
                            </div>
                            <button type="button" class="btn btn-success btn-block font-weight-bold" onclick="processStegoEncode()">3️⃣ Ẩn Tin</button>
                        </form>
                        <div class="mt-4 text-center" id="encodeResult" style="display: none;">
                            <p class="text-success font-weight-bold mb-2">✅ Ẩn tin thành công!</p>
                            <img id="encodedImagePreview" style="max-width: 100%; height: auto; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 4px;">
                            <br>
                            <a id="downloadEncoded" class="btn btn-outline-success font-weight-bold" download="encoded_image.png">⬇️ Tải ảnh đã giấu tin</a>
                        </div>
                    </div>
                </div>

                <!-- Decode Section -->
                <div class="col-md-6 mb-3">
                    <div class="card p-4 stego-card h-100" style="border-top: 4px solid #007bff;">
                        <h6 class="font-weight-bold text-primary mb-3">🔓 Giải Mã (Decode)</h6>
                        <form id="decodeForm">
                            <div class="form-group">
                                <label class="font-weight-bold">1️⃣ Chọn ảnh đã giấu tin (PNG):</label>
                                <input type="file" class="form-control-file" id="decodeImage" accept="image/png, image/bmp" required onchange="previewImage(this, 'decodeSelectedPreview')">
                                <div class="mt-2 text-center">
                                    <img id="decodeSelectedPreview" style="max-width: 100%; max-height: 200px; display: none; border-radius: 4px; border: 1px solid #ddd;">
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary btn-block font-weight-bold mt-4" onclick="processStegoDecode()">2️⃣ Giải Mã</button>
                        </form>
                        <div class="mt-4" id="decodeResult" style="display: none;">
                            <label class="font-weight-bold text-primary">3️⃣ Nội dung giải mã được:</label>
                            <textarea class="form-control bg-light" id="decodedText" rows="4" readonly></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // ==================== CRYPTOGRAPHY ====================
        function launchLab03(algo) {
            fetch('/launch_lab03/' + algo, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    alert("Không thể mở Form Lab-03: " + data.error);
                }
            })
            .catch(error => {
                alert("Đã xảy ra lỗi: " + error);
            });
        }

        // ==================== STEGANOGRAPHY ====================
        function processStegoEncode() {
            var imageInput = document.getElementById('encodeImage');
            var textInput = document.getElementById('encodeText').value;

            if (imageInput.files.length === 0) {
                alert("Vui lòng chọn hình ảnh để giấu tin!");
                return;
            }
            if (!textInput.trim()) {
                alert("Vui lòng nhập nội dung cần giấu!");
                return;
            }

            var formData = new FormData();
            formData.append("image", imageInput.files[0]);
            formData.append("text", textInput);

            fetch('/api/stego/encode', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    var imgSrc = "data:image/png;base64," + data.image_base64;
                    document.getElementById('encodedImagePreview').src = imgSrc;
                    document.getElementById('downloadEncoded').href = imgSrc;
                    document.getElementById('encodeResult').style.display = 'block';
                } else {
                    alert("Lỗi ẩn tin: " + data.error);
                }
            })
            .catch(error => {
                alert("Đã xảy ra lỗi: " + error);
            });
        }

        function processStegoDecode() {
            var imageInput = document.getElementById('decodeImage');

            if (imageInput.files.length === 0) {
                alert("Vui lòng chọn ảnh đã giấu tin (file PNG)!");
                return;
            }

            var formData = new FormData();
            formData.append("image", imageInput.files[0]);

            fetch('/api/stego/decode', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('decodedText').value = data.result;
                    document.getElementById('decodeResult').style.display = 'block';
                } else {
                    alert("Lỗi giải mã: " + data.error);
                }
            })
            .catch(error => {
                alert("Đã xảy ra lỗi: " + error);
            });
        }

        function previewImage(input, previewId) {
            var preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }
    </script>
</body>
</html>
