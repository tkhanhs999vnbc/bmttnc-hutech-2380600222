<!DOCTYPE html>
<html lang="en">
<head>
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <p><a href="/">← Quay lại Menu chính</a></p>
        <table class="table table-bordered">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px; background-color: #f8f9fa;">MẬT MÃ PLAYFAIR</td></tr>
            <tr><td style="font-weight: bold; color: blue">ENCRYPTION (MÃ HÓA)</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/playfair/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" pattern="[A-Za-z\s]+" title="Vui lòng chỉ nhập chữ cái tiếng Anh không dấu (A-Z, a-z) và khoảng trắng, không nhập số hay ký tự đặc biệt" placeholder="Nhập chuỗi văn bản" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text" class="form-control" name="inputKeyPlain" pattern="[A-Za-z]+" title="Từ khóa chỉ được chứa ký tự chữ cái tiếng Anh không dấu, không bao gồm số, khoảng trắng hay ký tự đặc biệt" placeholder="Ví dụ: MONARCHY" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            <tr><td style="font-weight: bold; color: green">DECRYPTION (GIẢI MÃ)</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/playfair/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" pattern="[A-Za-z\s]+" title="Văn bản mật mã chỉ được chứa ký tự chữ cái tiếng Anh không dấu (A-Z, a-z) và khoảng trắng" placeholder="Nhập chuỗi mật mã" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text" class="form-control" name="inputKeyCipher" pattern="[A-Za-z]+" title="Từ khóa chỉ được chứa ký tự chữ cái tiếng Anh không dấu, không bao gồm số, khoảng trắng hay ký tự đặc biệt" placeholder="Nhập đúng từ khóa" required/>
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
