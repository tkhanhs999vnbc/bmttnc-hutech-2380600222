<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <p><a href="/">← Quay lại Menu chính</a></p>
        <table class="table table-bordered">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px; background-color: #f8f9fa;">MẬT MÃ RAIL FENCE</td></tr>
            <tr><td style="font-weight: bold; color: blue">ENCRYPTION (MÃ HÓA)</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/railfence/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text (Chỉ nhập chữ cái tiếng Anh không dấu):</label>
                            <input type="text" class="form-control" name="inputPlainText" pattern="[A-Za-z\s]+" title="Văn bản chỉ được chứa ký tự chữ cái tiếng Anh không dấu (A-Z, a-z) và khoảng trắng" placeholder="Nhập chuỗi văn bản" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Số hàng rào từ 2 trở lên):</label>
                            <input type="number" class="form-control" name="inputKeyPlain" min="2" step="1" title="Số hàng rào phải là số nguyên lớn hơn hoặc bằng 2" placeholder="Ví dụ: 3" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            <tr><td style="font-weight: bold; color: green">DECRYPTION (GIẢI MÃ)</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/railfence/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text (Chỉ nhập chữ cái tiếng Anh không dấu):</label>
                            <input type="text" class="form-control" name="inputCipherText" pattern="[A-Za-z\s]+" title="Văn bản mật mã chỉ được chứa ký tự chữ cái tiếng Anh không dấu (A-Z, a-z) và khoảng trắng" placeholder="Nhập chuỗi mật mã" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Số hàng rào từ 2 trở lên):</label>
                            <input type="number" class="form-control" name="inputKeyCipher" min="2" step="1" title="Số hàng rào phải là số nguyên lớn hơn hoặc bằng 2" placeholder="Ví dụ: 3" required/>
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
